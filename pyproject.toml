[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperclip-mcp"
version = "0.3.1"
description = "MCP server for the Paperclip AI agent orchestration platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "paperclip", "ai-agents", "llm", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[project.urls]
Homepage   = "https://github.com/godextreme/paperclip-mcp"
Repository = "https://github.com/godextreme/paperclip-mcp"
Issues     = "https://github.com/godextreme/paperclip-mcp/issues"

[project.scripts]
paperclip-mcp = "paperclip_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paperclip_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
# ANN401: MCP tools return arbitrary JSON from the Paperclip API — Any is the
# honest type for those returns.
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# fastmcp's @mcp.tool() decorator is not typed strictly enough for
# --strict; everything else stays strict.
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
