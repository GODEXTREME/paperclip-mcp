name: Auto-version on merge to master

on:
  push:
    branches: [master]

jobs:
  version:
    # Prevent infinite loop: skip if the bot itself pushed
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine bump type from conventional commits
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)

          echo "Commits since $LAST_TAG:"
          git log "${LAST_TAG}..HEAD" --oneline

          BUMP="patch"

          # Breaking change via ! after type/scope in subject line
          if git log "${LAST_TAG}..HEAD" --pretty="%s" | grep -qE '^[a-z]+(\(.+\))?!:'; then
            BUMP="major"
          # Breaking change footer (must be "BREAKING CHANGE:" at start of line)
          elif git log "${LAST_TAG}..HEAD" --pretty="%B" | grep -qE '^BREAKING CHANGE:'; then
            BUMP="major"
          # New feature
          elif git log "${LAST_TAG}..HEAD" --pretty="%s" | grep -qE '^feat(\(.+\))?:'; then
            BUMP="minor"
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Bump type: $BUMP"

      - name: Bump version in pyproject.toml
        id: ver
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          python3 - <<'EOF'
          import os, re, sys

          with open("pyproject.toml") as f:
              content = f.read()

          m = re.search(r'^version = "(\d+)\.(\d+)\.(\d+)"', content, re.MULTILINE)
          if not m:
              print("ERROR: could not find version in pyproject.toml", file=sys.stderr)
              sys.exit(1)

          major, minor, patch = int(m.group(1)), int(m.group(2)), int(m.group(3))
          bump = os.environ["BUMP"]

          if bump == "major":
              major += 1; minor = 0; patch = 0
          elif bump == "minor":
              minor += 1; patch = 0
          else:
              patch += 1

          new_version = f"{major}.{minor}.{patch}"
          new_content = re.sub(
              r'^version = "\d+\.\d+\.\d+"',
              f'version = "{new_version}"',
              content,
              flags=re.MULTILINE,
          )

          with open("pyproject.toml", "w") as f:
              f.write(new_content)

          print(f"Bumped {bump}: {m.group(1)}.{m.group(2)}.{m.group(3)} → {new_version}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={new_version}\n")
          EOF

      - name: Commit and tag
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.ver.outputs.version }}"
          git tag -a "v${{ steps.ver.outputs.version }}" \
            -m "Release v${{ steps.ver.outputs.version }}"
          git push origin master
          git push origin "v${{ steps.ver.outputs.version }}"
