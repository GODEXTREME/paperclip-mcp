# paperclip-mcp — Portainer-ready stack.
#
# All four variables below must be defined as environment variables in the
# Portainer Stack editor (mark PAPERCLIP_API_KEY and MCP_AUTH_TOKEN as
# sensitive). Nothing is hardcoded here on purpose.

services:
  paperclip-mcp:
    build: .
    # If you publish the image to GHCR instead of building on the NAS,
    # replace `build: .` with:
    #   image: ghcr.io/<your-user>/paperclip-mcp:latest
    container_name: paperclip-mcp
    restart: unless-stopped

    environment:
      PAPERCLIP_API_KEY: ${PAPERCLIP_API_KEY}
      PAPERCLIP_COMPANY_ID: ${PAPERCLIP_COMPANY_ID}
      PAPERCLIP_BASE_URL: ${PAPERCLIP_BASE_URL}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}

    ports:
      # Option 1 (recommended): only reachable from the NAS itself — put a
      # reverse proxy with TLS (or Tailscale) in front of it on the NAS.
      - "127.0.0.1:9011:9011"
      #
      # Option 2: exposed on the LAN. Acceptable only because every request
      # must carry the MCP_AUTH_TOKEN bearer token — but the token still
      # travels in cleartext over plain HTTP, so a TLS reverse proxy is
      # strongly recommended even on a trusted LAN.
      # - "9011:9011"

    # Container hardening
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
